name: CampusOS CI

on:
  push:
    branches:
      - main
      - codex/security-release
  pull_request:
  workflow_dispatch:

concurrency:
  group: campusos-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  zap-passive:
    name: Disposable API ZAP Passive Scan
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-quality, browser-security]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Scan isolated demo API only
        run: npm run scan:zap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-passive-reports
          path: output/security/zap/
          if-no-files-found: error
          retention-days: 14

  browser-security:
    name: Browser Security Scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-security-failures
          path: output/playwright/

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend test suite
        run: npm test

      - name: Audit backend runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend-quality:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: campusos_test
          POSTGRES_USER: campusos
          POSTGRES_PASSWORD: campusos_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusos -d campusos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: node --test tests/postgres-smoke.test.js
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://campusos:campusos_ci_only@localhost:5432/campusos_test
