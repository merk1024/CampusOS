databases:
  - name: campusos-staging-db
    databaseName: campusos_staging
    user: campusos_staging_user
    plan: free

services:
  - type: web
    name: campusos-staging-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:bootstrap && npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: DB_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: campusos-staging-db
          property: connectionString
      - key: PGSSL_ALLOW_SELF_SIGNED
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://campusos-staging-frontend.onrender.com
      - key: SUPERADMIN_EMAIL
        value: erbol.abdusatov@alatoo.edu.kg
      - key: SUPERADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: SUPERADMIN_NAME
        value: Erbol Abdusatov
  - type: web
    name: campusos-staging-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://campusos-staging-api.onrender.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://campusos-staging-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
